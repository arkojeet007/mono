[package]
rust-version.workspace = true
name = "koru"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
koru-features = { path = "../../crates/koru-features" }
koru-shell-chrome = { path = "../../crates/koru-shell-chrome" }
# The tab manager, the pane slot and the shell boundary. `MainView` uses the
# first two today (SP-9); the full delegation is SP-14's.
koru-app-shell = { path = "../../crates/koru-app-shell" }
# The explore tree came home when ADR-262 dissolved the old chrome crate, and
# brought its emoji splitting with it.
emojis.workspace = true
koru-core = { path = "../../crates/koru-core" }
# Chords, the primary modifier, and how a shortcut is written. Shared so
# `koru-workspace-host` and `koru-editor` agree without depending on each other.
koru-keys = { path = "../../crates/koru-keys" }
koru-draw = { path = "../../crates/koru-draw" }
koru-editor = { path = "../../crates/koru-editor" }
# The canvas surface: draws a plain scene and answers input with requests the
# canvas tab (`canvas_view`) performs against the canvas document.
koru-canvas-ui = { path = "../../crates/koru-canvas-ui" }
koru-appearance-ui = { path = "../../crates/koru-appearance-ui" }
koru-workspace-host = { path = "../../crates/koru-workspace-host" }
# **The accessibility schema only** — `Role`, `Action`, and nothing that speaks
# to a platform. This container names it because a semantic contribution is
# written in AccessKit's vocabulary; ADR-336 considered cloning that vocabulary
# into a second one and rejected it. The *adapter* stays in `koru-window`, and
# nothing here can reach a window, an HWND or a UIA provider.
accesskit.workspace = true
# The four actions a dictation asks for. This container routes them; the shell
# owns the session and the gesture, and nothing here opens a microphone.
koru-dictation = { path = "../../crates/koru-dictation" }
# **The store, reached directly.** Until now the app named no store type at all
# and everything went through `koru-workspace`. Search is the first surface
# whose *results* are store values rather than nodes, and it will not be the
# last — settings and feedback are going the same way. `koru-store-core` is here
# for the ids those values are made of.
#
# This replaced the app's own SQLite search index (a crate since deleted), `koru-docstore` (which
# only the index's profile-folder scanner used) and `fs2` (its broker lock).
# The search surface itself, which knows no node and no workspace so the
# agent can host the same one. What is left in `src/search.rs` is the
# adapter: this app's `View`, and the two translations only it can do.
koru-search-ui = { path = "../../crates/koru-search-ui" }
# The Artifacts column: what the workspace's delegated runs produced, and
# what they left that is not a result yet. Another surface that knows no
# node and no workspace document, hosted here as a mode of the explore
# column (ADR-352).
koru-artifacts-ui = { path = "../../crates/koru-artifacts-ui" }
# The Chats view (AGENTUX I5): every AI chat, newest first. The same surface
# the standalone chat window hosts as its floating pane.
koru-chats-ui = { path = "../../crates/koru-chats-ui" }
# Talking to the Koru Agent: the endpoint and the framing (`koru-ipc`), and
# every message that travels over it (`koru-agent-wire`). **Not `koru-agent`
# itself** — that is a windowed application carrying winit, vello and the search
# surface, and a shell that linked it to send a `Hello` would acquire a second
# copy of everything it already has.
koru-ipc = { path = "../../crates/koru-ipc" }
koru-agent-wire = { path = "../../crates/koru-agent-wire" }
koru-device = { path = "../../crates/koru-device" }
koru-oauth-credentials = { path = "../../crates/koru-oauth-credentials" }
koru-link = { path = "../../crates/koru-link" }
# Which channel this build is — for the endpoint's name, and for the Welcome
# screen's *Channel* and *Current* lines. **This is where `build_info` comes
# from now.** It used to be reached through `koru-update`, which meant that
# printing a version number linked reqwest, minisign-verify and zip; updating
# belongs to `koru-agent` and this app no longer depends on that crate at all.
koru-channel = { path = "../../crates/koru-channel" }
koru-log = { path = "../../crates/koru-log" }
koru-env = { path = "../../crates/koru-env" }
# The support chat's web surface. The one product binary that links wry,
# through this crate and nothing else (ADR-276).
koru-webview = { path = "../../crates/koru-webview" }
tracing.workspace = true
# Parsing the ids the agent sends as strings.
uuid.workspace = true
koru-i18n = { path = "../../crates/koru-i18n" }
# The session-recording modal validates the custom width/height against the
# capture engine's even-dimension rule before the shell ever sees a request
# (SESSIONRECORD I3). The capture itself is started by the shell, not here.
koru-recording = { path = "../../crates/koru-recording" }
# The consent record's types, for the sentence the consent step shows and the
# grant a test hands a controller. The window never resolves the record's path
# itself — `koru-workspace-host` does, because the directory is the host's.
koru-voice-consent = { path = "../../crates/koru-voice-consent" }
koru-api-client = { path = "../../crates/koru-api-client" }
# **Delegating work to an agent** (ROADMAP P1.14). The run's vocabulary,
# the `/v1/runs` bodies, and P1.7's pin — which this window performs over
# the gateway rather than over a `Store` it does not have, by implementing
# that crate's own `ContextStore` port. Naming the three is what keeps the
# modal from inventing a fourth vocabulary for a run.
koru-delegate-core = { path = "../../crates/koru-delegate-core" }
koru-delegate-api = { path = "../../crates/koru-delegate-api" }
koru-delegate-context = { path = "../../crates/koru-delegate-context" }
koru-delegate-document = { path = "../../crates/koru-delegate-document" }
koru-delegate-schedule = { path = "../../crates/koru-delegate-schedule" }
# **A canvas's chain** (CANVAS M5): the pure planner that says which step runs
# next, and the Markdown importer an output node builds its page with — the
# same one Koru AI's export seeds a page from (`koru-workspace-host` already
# links it, so the binary gains nothing).
koru-canvas-flow = { path = "../../crates/koru-canvas-flow" }
koru-import-markdown = { path = "../../crates/koru-import-markdown" }
# Typed schedule rules for the schedule surface's presentation adapter. The
# formatter consumes semantic picker parts; it never parses stored cron text.
koru-recurrence = { path = "../../crates/koru-recurrence" }
# Converts a projected occurrence epoch through the rule's semantic IANA zone,
# or through the explicit current-device zone for a local floating rule.
koru-time-zone = { path = "../../crates/koru-time-zone" }
# The Settings surface, and the section shapes its rows are about. The rows
# lived in `welcome/` until SP-7; they are shared with Koru Terminal and Koru
# AI now, and what stayed behind is the readings only this process can take
# (`settings_view.rs`).
koru-settings-ui = { path = "../../crates/koru-settings-ui" }
koru-settings = { path = "../../crates/koru-settings" }
# The workspace-management surface. The manager lived in `src/workspaces.rs`
# until SP-8b; it is shared with Koru Terminal and Koru AI now, and what stayed
# behind is the seam that performs what needs a Koru window.
koru-workspaces-ui = { path = "../../crates/koru-workspaces-ui" }
# The run views (P1.16): Overview, Activity and Result for one delegated run,
# and the handover a person takes the session through. What stayed behind in
# `run_view.rs` is the seam that performs what needs this window's session
# connection — asking for the controller, giving it back, opening the tab.
koru-runs-ui = { path = "../../crates/koru-runs-ui" }
koru-ai-provider = { path = "../../crates/koru-ai-provider" }
koru-ai-ui = { path = "../../crates/koru-ai-ui" }
koru-socials-ui = { path = "../../crates/koru-socials-ui" }
koru-session-profiles = { path = "../../crates/koru-session-profiles" }
koru-session-protocol = { path = "../../crates/koru-session-protocol" }
# A session as an ordinary Koru tab (TERMINATAB W4): the extracted session
# surface, the backend command thread it is driven by, the view vocabulary the
# adapter translates into, and the stats handle the surface is built over.
koru-agents-ui = { path = "../../crates/koru-agents-ui" }
koru-session-backend = { path = "../../crates/koru-session-backend" }
koru-session-view = { path = "../../crates/koru-session-view" }
koru-session-observability = { path = "../../crates/koru-session-observability" }
koru-store-core = { path = "../../crates/koru-store-core" }
# Settings' tone preview plays the bundled reminder tones where they are
# chosen; the tone inventory and the assets' lookup already live here.
koru-native-notifications = { path = "../../crates/koru-native-notifications" }
koru-store-wire = { path = "../../crates/koru-store-wire" }
# A write receipt carries the document's version vector, and the wait that
# holds it merges two of them. The type is already in the workspace's public
# API (`WorkspaceDoc::version`); naming the crate is what lets the panels use it.
loro = { workspace = true }
koru-history = { path = "../../crates/koru-history" }
koru-ui = { path = "../../crates/koru-ui" }
koru-clipboard = { path = "../../crates/koru-clipboard" }
# Named directly because `main` needs the machine-local search state path, and
# the Agent — which has no workspace host — reads the very same file.
koru-window = { path = "../../crates/koru-window" }
koru-workspace = { path = "../../crates/koru-workspace" }
koru-document = { path = "../koru-document" }
vello.workspace = true
winit.workspace = true
# The diff view caches parley layouts per row, the same shape koru-ai-ui uses.
parley.workspace = true
# Welcome's released/built stamp: RFC 3339 in, local time out.
chrono.workspace = true
qrcode.workspace = true
reqwest.workspace = true
zip.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# The Dock menu (`muda`) was once declared here and never imported. The shell
# now installs the custom application delegate winit deliberately leaves to its
# host so LaunchServices URLs work; a future `applicationDockMenu:` can extend
# that same delegate, but no Dock-recents implementation lives in this app yet.

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# The icon and version block. A crate rather than a copied build script,
# because finding `rc.exe` is sixty lines nobody should own twice.
[build-dependencies]
koru-winres = { path = "../../crates/koru-winres" }

[dev-dependencies]
# Every surface on by default in tests; `koru_features::testing::with` opts
# one test into the simplified product.
koru-features = { path = "../../crates/koru-features", features = ["testing"] }
tempfile.workspace = true
# A drawn diagram for the leaf and container tests to open their viewer on.
koru-diagram = { path = "../../crates/koru-diagram" }
koru-workspace-host = { path = "../../crates/koru-workspace-host", features = ["no-model-reader"] }
koru-ai-core = { path = "../../crates/koru-ai-core" }
koru-ai-ui = { path = "../../crates/koru-ai-ui", features = ["no-client"] }
koru-socials-ui = { path = "../../crates/koru-socials-ui", features = ["no-reader"] }
# **The same crate, with `no-reader` on.** A `SearchSurface` built in a test must
# not dial the store a developer has running, and `cfg(test)` inside
# `koru-search-ui` cannot reach here — a dependency is never compiled with it.
# Resolver 2+ keeps a dev-only feature out of the binary's own build.
koru-search-ui = { path = "../../crates/koru-search-ui", features = ["no-reader"] }
# **And the same again for the Artifacts column.** An `ArtifactsSurface`
# built in a test must not dial the gateway a developer has running.
koru-artifacts-ui = { path = "../../crates/koru-artifacts-ui", features = ["no-reader"] }
koru-chats-ui = { path = "../../crates/koru-chats-ui", features = ["no-reader"] }
# **And the Workspaces controller's fixtures**: the Manage tab's suite feeds it
# the gateway's answers (a consequence, a move's consequence, a refusal) that
# only its own crate could otherwise construct.
koru-workspaces-ui = { path = "../../crates/koru-workspaces-ui", features = ["fixtures"] }
# **And the same crate again, with `no-engine` on.** A `Dictation` built in a
# test must not dial a voice worker or ask an agent to start one, and
# `cfg(test)` inside `koru-dictation` cannot reach here.
koru-dictation = { path = "../../crates/koru-dictation", features = ["no-engine"] }
# **And the same crate again, with `no-browser` on.** A plain click on a link
# hands the URL to the OS handler; a test that clicks one would open a real
# browser window on whoever is running the suite. Same reason `cfg(test)`
# cannot do it from inside `koru-editor`.
koru-editor = { path = "../../crates/koru-editor", features = ["no-browser"] }
# **And the same crate again, with `no-webview` on.** A support session built
# in a test must not create a browser process; `open` answers "no runtime"
# and every state around the surface is still reachable. Same reason
# `cfg(test)` cannot do it from inside `koru-webview`.
koru-webview = { path = "../../crates/koru-webview", features = ["no-webview"] }

# **The UI Automation *client*, and only in the interactive shell proof.**
# Koru's accessibility bridge is a UIA *provider*; the proof in
# `src/mainview/accessibility/document/native.rs` stands outside it and asks the
# questions Narrator asks, which is the only way to establish that the *shipping
# window* — not a harness around the editor — hands a paragraph's text, caret
# and selection to an external client. The same binding stack
# `koru-workspace-host` and `apps/koru-document` already use, so no second
# stack arrives, and resolver 2 keeps these dev-only features out of the
# binary's own build.
#
# `windows-core` is named directly because `#[implement]` expands to
# `windows_core::` paths: the macro is re-exported by `windows::core`, but the
# code it generates refers to the crate by its own name. There is no `implement`
# feature in 0.62 — asking for one is a resolver error.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
