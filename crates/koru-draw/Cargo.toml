[package]
rust-version.workspace = true
name = "koru-draw"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
parley.workspace = true
# The diagram scene this crate measures for and paints (`diagram`): shapes as
# kurbo paths, labels as placed lines, roles in place of colors. The
# dependency runs this way only — koru-diagram has no font and no renderer —
# so the MCP server can ask whether a text draws without linking vello.
koru-diagram = { path = "../koru-diagram" }
# The scene's geometry vocabulary, the same crate vello re-exports, named here
# so a `koru_diagram` path and a vello shape are visibly one type.
kurbo = { workspace = true }
# Glyph ink bounds, for optically centring one glyph in a tile. parley reports
# *font* metrics (ascent/descent), which for a colour emoji describe a box its
# ink does not fill - see `scene::centre_in`. The font stack already resolves
# this crate, so it adds no second copy of it.
skrifa = "0.43"
vello.workspace = true
peniko.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The product mark is a 512 px PNG decoded once and downscaled on the CPU:
# vello has no mipmaps and `ImageQuality` is a single tap, not a mip chain.
# See `brand.rs`, and ADR-43 for why this is not solved by shipping a PNG per
# size.
image = "0.25"
# Leading emoji in a document title (page icon / suppress kind glyph on pills).
koru-title = { path = "../koru-title" }
# The mark wears its channel's color — the tint is applied once to the decoded
# master in `brand.rs`. A leaf crate, so this costs no transitive weight.
koru-channel = { path = "../koru-channel" }

[dev-dependencies]
# The SVG a diagram is saved as is checked as XML, not by grepping for tags:
# the writer emits no text and no font, and a balanced document is what a
# browser will open.
quick-xml = { workspace = true }
