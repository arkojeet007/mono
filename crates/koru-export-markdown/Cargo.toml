[package]
rust-version.workspace = true
name = "koru-export-markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Markdown exporter for Koru documents."

[dependencies]
chrono.workspace = true
koru-export = { path = "../koru-export" }
koru-link = { path = "../koru-link" }
koru-core = { path = "../koru-core" }

[dev-dependencies]
tempfile.workspace = true
# The round trip: what this crate writes for a callout box is what the
# importer reads back as one.
koru-import = { path = "../koru-import" }
koru-import-markdown = { path = "../koru-import-markdown" }
