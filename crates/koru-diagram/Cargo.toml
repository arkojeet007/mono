[package]
rust-version.workspace = true
name = "koru-diagram"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Mermaid diagrams for Koru: the one crate that links the merman engine. It takes the text of a code block and answers in Koru's own vocabulary — what kind of diagram it is, whether it draws and why not, the line of an error, the counts a reader hears — so that nothing above it ever sees a merman type. It inspects without laying out, cheaply enough for the MCP server to ask on every read; the theme-free, font-free layout for Koru to paint follows."

# **The dependencies are the charter.** `merman` is the engine and
# `merman-render` holds the layout structs the facade does not re-export; both
# come from the workspace table, which states their features and the reason for
# them once. They appear in this crate and nowhere else in the workspace — that
# is the point of the crate. `serde` is here because `Status` is what the MCP
# server emits for a code block, so its JSON shape is spelled once, on the
# type; `serde_json` builds merman's site config and reads its layout JSON. No
# koru-draw, no vello, no fonts: the MCP server and the AI tools link this
# crate to ask whether a diagram draws, and neither has a renderer.
[dependencies]
merman = { workspace = true }
merman-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
